services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/apps/server/uploads
    environment:
      - PORT=3001
      - CORS_ORIGIN=http://localhost,http://localhost:5173,http://localhost:5174,http://localhost:5175

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_SERVER_URL=http://localhost:3001
      - VITE_PLAYER_URL=http://localhost:5175
    depends_on:
      - server

  bigscreen:
    build:
      context: .
      dockerfile: apps/bigscreen/Dockerfile
    ports:
      - "5174:5174"
    environment:
      - VITE_SERVER_URL=http://localhost:3001
      - VITE_PLAYER_URL=http://localhost:5175
    depends_on:
      - server

  player:
    build:
      context: .
      dockerfile: apps/player/Dockerfile
    ports:
      - "5175:5175"
    environment:
      - VITE_SERVER_URL=http://localhost:3001
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - admin
      - bigscreen
      - player

volumes:
  uploads:
